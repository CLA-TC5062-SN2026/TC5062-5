# Integración continua de ReportaYa: en cada push y pull request a main.
# Backend: análisis estático, pruebas de reglas (un caso por criterio de aceptación) y prueba de contrato
# contra un servidor real. Frontend: lint y compilación. Docker: las dos imágenes compilan.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: secreto-solo-para-ci-con-mas-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Análisis estático (flake8, setup.cfg)
        run: flake8 app scripts
      - name: Pruebas de reglas, almacén, correo y respaldo
        run: python -m pytest -q
      - name: Prueba de contrato contra openapi_equipo.yaml
        run: |
          python scripts/init_db.py --reset --demo
          uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          python tests/test_contrato.py
      - if: failure()
        run: cat api.log || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar las imágenes de Docker Compose
        run: |
          cp backend/.env.example backend/.env
          docker compose build
