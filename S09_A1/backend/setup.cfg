# Configuración del análisis estático (S09-A1). Uso, desde backend/:
#   .venv/bin/pylint app scripts
#   .venv/bin/flake8 app scripts
#   .venv/bin/mypy app scripts

[flake8]
# 120 en lugar de 79: el equipo usa pantallas anchas; más allá de 120 se marca.
max-line-length = 120
# Complejidad ciclomática máxima por función (McCabe). Más de 10 se reporta como C901.
max-complexity = 10
exclude = .venv,__pycache__,uploads

[mypy]
python_version = 3.13
# Revisa también el cuerpo de las funciones sin anotaciones (la mayoría del código).
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
ignore_missing_imports = True

[pylint.main]
py-version = 3.13
ignore = .venv,uploads

[pylint.format]
max-line-length = 120

[pylint.design]
# Límites por defecto de pylint, explícitos para documentar el criterio.
max-args = 5
max-locals = 15
max-branches = 12
max-statements = 50

[pylint.similarities]
# Detecta código duplicado (DRY) a partir de 6 líneas iguales.
min-similarity-lines = 6
