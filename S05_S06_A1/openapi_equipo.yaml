      summary: Registrar la terminación con evidencia (EnProceso → Terminado)
      description: |-
        `multipart/form-data` con la parte opcional `datos` (JSON `CompletionData`) y de 1 a 5 `fotos` de evidencia del ciclo actual (JPEG o PNG, 10 MB). La nota de trabajo es opcional (hasta 1,000 caracteres).
