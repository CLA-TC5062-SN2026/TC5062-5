  # ================= Reportes =================
  /reports:
    get:
      tags: [Reportes]
      summary: Listar reportes visibles para el rol; con búsqueda para la Administración
      description: |-
        Una sola colección; el alcance lo decide el rol del JWT, no la URL (RNF-05).
        - **Residente:** reportes de su unidad desde su fecha de vinculación, los que reportó y los de áreas comunes, estos sin datos del reportante (RF-10).
        - **Vigilancia:** solo los que registró (RF-04-AC-7).
        - **Mantenimiento:** solo los asignados a él en `Asignado` o `EnProceso`, por prioridad (Urgente, Normal, Menor) y, a igual prioridad, por fecha de aviso ascendente (RF-16). El servidor aplica filtro y orden; el cliente no los elige. Con autorización de acceso «No» incluye `mensajeAcceso`. Debe poder cargarse para consulta sin señal (RNF-11).
        - **Administración:** todos, por fecha de aviso descendente (RF-12), incluidos cerrados y de usuarios desactivados.

        Los filtros `ubicacionTipo`, `ubicacionId`, `categoriaId`, `estado`, `prioridad`, `responsableId`, `medioOrigen`, `avisoDesde`, `avisoHasta` y `texto` son exclusivos de la Administración y se combinan; cualquier otro rol que los envíe recibe 403 (RF-12-AC-5). El filtro de ubicación coincide con la ubicación observada **o** la de origen (RF-12-AC-2). Los rangos de fecha son inclusivos por días completos.
      operationId: listReports
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: [RF-02-AC-3, RF-04-AC-3, RF-04-AC-7, RF-06-AC-1, RF-06-AC-4, RF-10-AC-1, RF-10-AC-4, RF-10-AC-5, RF-10-AC-6, RF-12-AC-1, RF-12-AC-2, RF-12-AC-4, RF-12-AC-5, RF-15-AC-2, RF-16-AC-1, RF-16-AC-2, RF-16-AC-3, RF-16-AC-4]
      x-idempotent: true
      parameters:
        - {name: ubicacionTipo, in: query, description: Se usa junto con `ubicacionId`., schema: {$ref: '#/components/schemas/TipoUbicacion'}}
        - {name: ubicacionId, in: query, schema: {type: string, format: uuid}}
        - {name: categoriaId, in: query, schema: {type: string, format: uuid}}
        - name: estado
          in: query
          description: Uno o varios estados separados por coma.
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/EstadoReporte'}
        - {name: prioridad, in: query, schema: {$ref: '#/components/schemas/Prioridad'}}
        - {name: responsableId, in: query, description: Id de un usuario de Mantenimiento o de un proveedor sin acceso., schema: {type: string, format: uuid}}
        - {name: medioOrigen, in: query, schema: {$ref: '#/components/schemas/MedioOrigen'}}
        - {name: avisoDesde, in: query, description: 'Día inicial inclusivo de la fecha de aviso (00:00:00).', schema: {type: string, format: date}}
        - {name: avisoHasta, in: query, description: 'Día final inclusivo de la fecha de aviso (23:59:59).', schema: {type: string, format: date}}
        - {name: texto, in: query, description: Texto contenido en la descripción., schema: {type: string, minLength: 1, maxLength: 100}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de reportes visibles para el rol, con los campos que su matriz de visibilidad permite.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Reportes]
      summary: Crear un reporte (alta del Residente o captura en nombre de un tercero)
      description: |-
        `multipart/form-data` con la parte `datos` (JSON `ReportCreate`), de 0 a 5 `fotos` (JPEG o PNG, máximo 10 MB cada una) y un `video` opcional (MP4, máximo 50 MB).

        El servidor asigna el folio siguiente, fija la fecha de aviso, deja el reporte en `Reportado`, calcula la prioridad sugerida (RD-01; `Urgente` si `esPeligroso`), marca posibles duplicados **sin impedir la creación** (RF-17), genera los avisos de alta (RF-11) y no pide datos del propietario (RF-24).

        - **Residente (RF-03):** medio de origen «Sistema» y fecha de aviso igual a la hora del sistema. Solo puede reportar en su unidad o en un área común. Si envía campos de captura (`medioOrigen`, `fechaAviso`, `residenteReportanteId`, `nombreReferencia`, `contactoReferencia`) recibe 403 (RF-04-AC-8).
        - **Administración y Vigilancia (RF-04):** `medioOrigen` y `fechaAviso` (no futura) obligatorios; `residenteReportanteId` o, si no hay, `nombreReferencia`. Se guarda siempre quién capturó y la fecha de captura; los tiempos se calculan desde la fecha de aviso.
        - Cada archivo se valida por separado: los válidos se guardan y los inválidos se informan en `archivosRechazados`. Más de 5 fotos produce 422 y no crea el reporte.
        - `Idempotency-Key` evita duplicar el reporte cuando la PWA reintenta un envío pendiente (RNF-11).
      operationId: createReport
      x-roles: [Residente, Vigilancia, Administración]
      x-acceptance-criteria: [RF-03-AC-1, RF-03-AC-2, RF-03-AC-3, RF-03-AC-4, RF-03-AC-6, RF-03-AC-7, RF-03-AC-8, RF-03-AC-9, RF-03-AC-10, RF-04-AC-1, RF-04-AC-2, RF-04-AC-3, RF-04-AC-4, RF-04-AC-6, RF-04-AC-8, RF-04-AC-9, RF-05-AC-1, RF-05-AC-2, RF-05-AC-3, RF-05-AC-4, RF-05-AC-5, RF-05-AC-6, RF-06-AC-5, RF-06-AC-6, RF-06-AC-7, RF-11-AC-1, RF-17-AC-1, RF-17-AC-5, RF-17-AC-6, RF-24-AC-1]
      x-ui-acceptance-criteria: [RF-03-AC-5, RF-03-AC-7]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ReportCreateForm'}
            encoding:
              datos: {contentType: application/json}
              fotos: {contentType: 'image/jpeg, image/png'}
              video: {contentType: video/mp4}
      responses:
        '201':
          description: Reporte creado en `Reportado`.
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: El rol no puede crear reportes o un Residente envió campos de captura en nombre de terceros (RF-04-AC-8).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: |-
            Validación fallida con el nombre del campo; no se crea el reporte. Ejemplos: «La descripción debe tener entre 10 y 1,000 caracteres»,
            «Indique si autoriza el acceso a su departamento», «Indique si el problema es peligroso o está empeorando», «Indique el subtipo»,
            «Solo puede reportar en su unidad o en áreas comunes», «La fecha del aviso no puede ser futura», «Indique el nombre de quien reporta»,
            «Indique si el ocupante autoriza el acceso», «Máximo 5 fotografías por etapa».
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {codigo: VALIDACION, mensaje: 'La descripción debe tener entre 10 y 1,000 caracteres', errores: [{campo: descripcion, mensaje: 'La descripción debe tener entre 10 y 1,000 caracteres'}]}
        '500': {$ref: '#/components/responses/ServerError'}
  /reports/possible-duplicates:
    get:
      tags: [Reportes]
      summary: Consultar posibles duplicados antes de confirmar una captura
      description: Apoya RF-17, que pide mostrar la advertencia antes de confirmar cuando captura la Administración. Aplica la misma regla que `POST /reports`, es decir reportes abiertos de la misma categoría y la misma ubicación (unidades, mismo piso de la misma torre; áreas comunes, la misma área). La ruta estática se resuelve antes que `/reports/{folio}`.
      operationId: findPossibleDuplicates
      x-roles: [Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-17, RD-13]
      x-idempotent: true
      parameters:
        - {name: categoriaId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: ubicacionTipo, in: query, required: true, schema: {$ref: '#/components/schemas/TipoUbicacion'}}
        - {name: ubicacionId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Reportes abiertos que serían posibles duplicados (lista vacía si no hay).
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ReportSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /reports/{folio}:
    parameters:
      - {$ref: '#/components/parameters/Folio'}
    get:
      tags: [Reportes]
      summary: Detalle de un reporte, filtrado por la matriz de visibilidad (2.3)
      description: |-
        Residente: sin notas, sin monto, sin datos del propietario ni del responsable; en áreas comunes sin el reportante.
        Mantenimiento: solo asignados; ve autorización y horarios de acceso (si «No», `mensajeAcceso`).
        Administración: todo, incluidos propietario, capturado por y monto. Fotos y evidencias se agrupan por ciclo.
        Un reporte no visible para el usuario responde 404.
      operationId: getReport
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: [RF-04-AC-5, RF-05-AC-5, RF-08-AC-3, RF-10-AC-2, RF-10-AC-3, RF-10-AC-5, RF-10-AC-6, RF-12-AC-3, RF-15-AC-3, RF-16-AC-4, RF-19-AC-2, RF-20-AC-5, RF-24-AC-2, RF-24-AC-3, RF-25-AC-3]
      x-idempotent: true
      responses:
        '200':
          description: Detalle.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [Reportes]
      summary: Corregir categoría, subtipo, descripción o ubicación (versión nueva, RNF-07)
      description: El Residente que lo registró solo puede corregirlo en `Reportado` (desde `Asignado` responde 409); la Administración, en cualquier estado no final. Cada corrección crea una `VersionCorreccion` y conserva la anterior. Si cambian categoría o subtipo, la prioridad sugerida se recalcula. La reclasificación de gestión (prioridad, responsable, responsabilidad) va en `/classification`.
      operationId: correctReport
      x-roles: [Residente, Administración]
      x-acceptance-criteria: [RF-26-AC-1, RF-26-AC-3, RF-26-AC-4, RF-26-AC-5]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ReportCorrection'}
      responses:
        '200':
          description: Reporte corregido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Reportes]
      summary: Borrar un reporte (siempre rechazado, RNF-07)
      description: Los reportes no se eliminan. El endpoint deja el rechazo explícito y probable; responde 403 a cualquier rol que vea el reporte.
      operationId: deleteReportRejected
      x-roles: [ninguno]
      x-acceptance-criteria: []
      x-requirements: [RNF-07]
      x-idempotent: true
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /reports/{folio}/history:
    get:
      tags: [Reportes]
      summary: Historial completo de solo inserción
      description: Cambios de estado, reclasificaciones, notas, versiones de corrección, detenciones, costos, confirmaciones, indicaciones de persistencia y constancia de avisos, con autor, fecha y valores anterior y nuevo. Administración ve todo; el Mantenimiento asignado, todo menos costos; el Residente solo los cambios de estado de sus reportes.
      operationId: getReportHistory
      x-roles: [Residente, Mantenimiento, Administración]
      x-acceptance-criteria: [RF-06-AC-1, RF-06-AC-4, RF-06-AC-8, RF-07-AC-1, RF-07-AC-6, RF-07-AC-10, RF-08-AC-7, RF-09-AC-5, RF-12-AC-3, RF-15-AC-1, RF-18-AC-1, RF-18-AC-3, RF-20-AC-4, RF-21-AC-4, RF-26-AC-2]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/Folio'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Entradas en orden cronológico.
          content:
