      responses:
        '200':
          description: Archivos visibles para el rol (fotos de interiores solo de su unidad, RD-08).
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FileRef'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /reports/{folio}/files/{fileId}:
    parameters:
      - {$ref: '#/components/parameters/Folio'}
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Archivos]
      summary: Descargar una foto o un video
      operationId: downloadReportFile
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: [RF-05-AC-5]
      x-idempotent: true
      responses:
        '200':
          description: Contenido del archivo.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            video/mp4: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Archivos]
      summary: Borrar un archivo (siempre rechazado, RNF-07)
      description: Ningún archivo se puede borrar, ni siquiera la Administración. Responde 403 y el archivo sigue guardado (404 si no es visible).
      operationId: deleteReportFileRejected
      x-roles: [ninguno]
      x-acceptance-criteria: [RF-05-AC-7]
      x-idempotent: true
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /reports/{folio}/files/{fileId}/shares:
    post:
      tags: [Archivos]
      summary: Dejar constancia de una foto compartida manualmente con un proveedor sin acceso (RNF-15)
      description: Bitácora de qué foto, con quién y cuándo. El envío de la foto se hace fuera del sistema.
      operationId: createFileShare
      x-roles: [Administración]
      x-acceptance-criteria: []
      x-requirements: [RNF-15, RD-08]
      x-idempotent: false
      parameters:
        - {$ref: '#/components/parameters/Folio'}
        - {$ref: '#/components/parameters/FileId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proveedorId]
              properties:
                proveedorId: {type: string, format: uuid}
                consentimientoResidente: {type: boolean, description: Requerido cuando la foto muestra el interior de una unidad.}
      responses:
        '201':
          description: Constancia registrada.
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileShare'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Costos y garantía =================
  /reports/{folio}/costs:
    parameters:
      - {$ref: '#/components/parameters/Folio'}
    get:
      tags: [Costos y garantía]
      summary: Entradas de costo del reporte (vigentes y anuladas)
      description: El monto es solo de la Administración; el Residente obtiene el pagador dentro del detalle del reporte.
      operationId: listCosts
      x-roles: [Administración]
      x-acceptance-criteria: [RF-20-AC-4]
      x-idempotent: true
      responses:
        '200':
          description: Entradas de costo, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Cost'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Costos y garantía]
      summary: Registrar costo y pagador, o corregir uno previo
      description: Posible en cualquier estado, incluidos `Terminado` y `Cerrado`. Una corrección es una entrada nueva con `anulaCostoId`; la original se conserva (RNF-07).
      operationId: createCost
      x-roles: [Administración]
      x-acceptance-criteria: [RF-20-AC-1, RF-20-AC-2, RF-20-AC-3, RF-20-AC-4]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CostCreate'}
      responses:
        '201':
          description: Entrada de costo vigente.
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cost'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: «El monto no puede ser negativo».
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/ServerError'}
  /reports/{folio}/warranty:
    put:
      tags: [Costos y garantía]
      summary: Marcar la reparación «con garantía» (extiende la retención de fotos, RNF-13)
      description: Sobre un reporte `Terminado`. Permite que la Administración marque la garantía después, por ejemplo cuando el avance lo registra en nombre de un proveedor sin acceso. La fecha no puede ser pasada.
      operationId: setWarranty
      x-roles: [Mantenimiento, Administración]
      x-acceptance-criteria: [RF-25-AC-1, RF-25-AC-2]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/Folio'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [garantiaVencimiento]
              properties:
                garantiaVencimiento: {type: string, format: date}
      responses:
        '200':
          description: Garantía registrada en el ciclo `Terminado`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422':
          description: «La fecha de vencimiento no puede ser pasada».
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Avisos =================
  /notifications:
    get:
      tags: [Avisos]
      summary: Avisos dentro del sistema del usuario autenticado
      description: Cada usuario con cuenta ve solo sus avisos (RF-11). Los avisos para reportantes «Sin cuenta» llegan a la Administración con la indicación de comunicarlos manualmente (RF-11-AC-8). El residente no recibe avisos por el paso a `EnProceso` ni por notas internas (RF-11-AC-7).
      operationId: listNotifications
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: [RF-11-AC-1, RF-11-AC-2, RF-11-AC-3, RF-11-AC-4, RF-11-AC-5, RF-11-AC-6, RF-11-AC-7, RF-11-AC-8, RF-11-AC-9]
      x-idempotent: true
      parameters:
        - {name: leido, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de avisos, del más reciente al más antiguo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
  /notifications/{notificationId}:
    patch:
      tags: [Avisos]
      summary: Marcar un aviso como leído
      operationId: markNotificationRead
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-11]
      x-idempotent: true
      parameters:
        - {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [leido]
              properties:
                leido: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Aviso actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /email-deliveries:
    get:
      tags: [Avisos]
      summary: Correos enviados con su estado (incluye los «Fallidos»)
      description: Tras 3 intentos fallidos con 10 minutos de separación el correo queda `Fallido` y es visible aquí (RF-11-AC-4). El fallo nunca impide guardar el cambio que lo originó.
      operationId: listEmailDeliveries
      x-roles: [Administración]
      x-acceptance-criteria: [RF-11-AC-4]
      x-idempotent: true
      parameters:
        - {name: estado, in: query, schema: {$ref: '#/components/schemas/EstadoCorreo'}}
        - {name: folio, in: query, schema: {$ref: '#/components/schemas/Folio'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de envíos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailDeliveryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Tablero =================
  /metrics:
    get:
      tags: [Tablero]
      summary: Tablero de tiempos, recurrencia y adopción; exportable a PDF con `Accept`
      description: |-
        Para un rango de fechas de aviso (inclusivo). Con `Accept: application/json` devuelve el tablero; con `Accept: application/pdf` devuelve el mismo contenido imprimible (periodo, tiempos promedio por prioridad, cumplimiento, incidencias recurrentes y adopción) con las **mismas cifras** que la pantalla (RF-23-AC-2, RNF-16).
        Los `Cancelado` y `Unido` no cuentan en promedios, cumplimiento, recurrencia ni adopción. Los porcentajes se redondean al entero. Las reaperturas aparecen como dato aparte. Los objetivos y la ventana de recurrencia vienen de `/parameters`.
      operationId: getMetrics
      x-roles: [Administración]
      x-acceptance-criteria: [RF-13-AC-1, RF-13-AC-2, RF-13-AC-3, RF-13-AC-4, RF-13-AC-5, RF-13-AC-6, RF-13-AC-7, RF-13-AC-8, RF-23-AC-1, RF-23-AC-2, RF-23-AC-3, RF-27-AC-1]
      x-idempotent: true
      parameters:
        - {name: desde, in: query, required: true, description: Primer día del rango de fechas de aviso., schema: {type: string, format: date}}
        - {name: hasta, in: query, required: true, description: 'Último día del rango (incluye hasta las 23:59:59).', schema: {type: string, format: date}}
      responses:
        '200':
          description: Tablero del periodo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metrics'}
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Delegaciones =================
  /delegations:
    get:
      tags: [Delegaciones]
      summary: Delegaciones a la Auxiliar (vigentes e históricas)
      operationId: listDelegations
      x-roles: [Administración]
      x-acceptance-criteria: [RF-21-AC-3]
      x-idempotent: true
      parameters:
        - {name: vigente, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Delegaciones.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Delegation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Delegaciones]
      summary: Habilitar la delegación temporal a la Auxiliar
      description: Habilita asignar, reclasificar, cerrar y clasificar urgencia y responsabilidad, con fecha de fin opcional. Solo el Administrador; la Auxiliar nunca se delega a sí misma, ni modifica parámetros ni autoriza gastos (RD-10).
      operationId: createDelegation
      x-roles: [Administración]
      x-acceptance-criteria: [RF-21-AC-1, RF-21-AC-5]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DelegationCreate'}
      responses:
        '201':
          description: Delegación vigente.
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Delegation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Ya existe una delegación vigente para esa Auxiliar.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /delegations/{delegationId}:
    patch:
      tags: [Delegaciones]
      summary: Deshabilitar la delegación o cambiar su fecha de fin
      description: 'Deshabilitar es `{"habilitada": false}`. La delegación se conserva en el historial; no se elimina (RNF-07). Surte efecto en la siguiente petición de la Auxiliar.'
      operationId: updateDelegation
      x-roles: [Administración]
      x-acceptance-criteria: [RF-21-AC-3, RF-21-AC-5]
      x-idempotent: true
      parameters:
        - {name: delegationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/DelegationUpdate'}
      responses:
        '200':
          description: Delegación actualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Delegation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Parámetros =================
  /parameters:
    get:
      tags: [Parámetros]
      summary: Parámetros configurables y su valor vigente
      operationId: listParameters
      x-roles: [Administración]
      x-acceptance-criteria: [RF-27-AC-1]
      x-idempotent: true
      responses:
        '200':
          description: Todos los parámetros de RF-27.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Parameter'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /parameters/{clave}:
    put:
      tags: [Parámetros]
      summary: Modificar el valor de un parámetro
      description: Solo el Administrador (la Auxiliar recibe 403). El valor debe ser mayor que cero. El cambio se aplica a consultas y evaluaciones posteriores y registra valor anterior, nuevo, usuario y fecha. Un cambio de `plazoConfirmacionHoras` rige para los ciclos que pasen a `Terminado` después (RF-27-AC-4).
      operationId: updateParameter
      x-roles: [Administración]
      x-acceptance-criteria: [RF-22-AC-4, RF-27-AC-1, RF-27-AC-2, RF-27-AC-3, RF-27-AC-4]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/ParametroClave'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor]
              properties:
                valor: {type: number, exclusiveMinimum: true, minimum: 0, example: 12}
      responses:
        '200':
          description: Parámetro actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Parameter'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: «El valor debe ser mayor que cero»; se conserva el valor vigente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {codigo: VALIDACION, mensaje: El valor debe ser mayor que cero, errores: [{campo: valor, mensaje: El valor debe ser mayor que cero}]}
        '500': {$ref: '#/components/responses/ServerError'}
  /parameters/{clave}/changes:
    get:
      tags: [Parámetros]
      summary: Bitácora de cambios del parámetro (solo inserción)
      operationId: listParameterChanges
      x-roles: [Administración]
      x-acceptance-criteria: [RF-27-AC-1]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/ParametroClave'}
      responses:
        '200':
          description: Cambios, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ParameterChange'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenido en `POST /sessions`. Expira tras 30 minutos de inactividad (RNF-06). El rol sale del token, nunca de la URL.

  parameters:
    Page: {name: page, in: query, description: Número de página (desde 1)., schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, description: Elementos por página., schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    UnitId: {name: unitId, in: path, required: true, schema: {type: string, format: uuid}}
    AreaId: {name: areaId, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    ProviderId: {name: providerId, in: path, required: true, schema: {type: string, format: uuid}}
    Folio: {name: folio, in: path, required: true, description: 'Folio del reporte, por ejemplo `RY-000124`.', schema: {$ref: '#/components/schemas/Folio'}}
    HoldId: {name: holdId, in: path, required: true, schema: {type: string, format: uuid}}
    FileId: {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
    ParametroClave: {name: clave, in: path, required: true, description: Clave del parámetro de RF-27., schema: {$ref: '#/components/schemas/ParametroClave'}}
    IfMatch: {name: If-Match, in: header, required: true, description: 'ETag del recurso leído; si cambió, responde 412.', schema: {type: string}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID generado por el cliente; un reintento con la misma clave devuelve el resultado original sin repetir la operación (RNF-11).
      schema: {type: string, format: uuid}

  headers:
    Location: {description: URL del recurso creado., schema: {type: string}}
    ETag: {description: Versión del recurso para `If-Match`., schema: {type: string}}

  responses:
    BadRequest:
      description: La petición no se pudo interpretar (JSON mal formado, tipo de dato incorrecto, parámetro desconocido).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: PETICION_INVALIDA, mensaje: La petición no es válida}
    Unauthorized:
      description: Sin sesión, JWT inválido o vencido.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: NO_AUTENTICADO, mensaje: Inicie sesión para continuar}
    Forbidden:
      description: El rol o la delegación vigente no permiten la acción; no cambia nada.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: PROHIBIDO, mensaje: No tiene permiso para esta acción}
    NotFound:
      description: El recurso no existe o no es visible para el usuario (matriz 2.3).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: NO_ENCONTRADO, mensaje: Recurso no encontrado}
    Conflict:
      description: El estado actual no permite la operación.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: TRANSICION_NO_PERMITIDA, mensaje: Transición no permitida}
    PreconditionFailed:
      description: El `If-Match` no coincide con la versión vigente; vuelva a leer el recurso.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: VERSION_OBSOLETA, mensaje: El recurso cambió; vuelva a consultarlo}
    PayloadTooLarge:
      description: El cuerpo excede el máximo permitido (foto 10 MB, video 50 MB).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unprocessable:
      description: Validación fallida; indica el campo y el mensaje.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: VALIDACION, mensaje: Datos inválidos, errores: [{campo: campo, mensaje: Mensaje de validación}]}
    ServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {codigo: ERROR_INTERNO, mensaje: Ocurrió un error inesperado}

  schemas:
    # ---------- Comunes ----------
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: {type: string, example: VALIDACION}
        mensaje: {type: string, description: Mensaje en español para mostrar al usuario.}
        errores:
          type: array
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: {type: string}
              mensaje: {type: string}
    Message:
      type: object
      required: [mensaje]
      properties:
        mensaje: {type: string}
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    Folio: {type: string, pattern: '^RY-\d{6}$', example: RY-000124}
    TipoUbicacion: {type: string, enum: [Unidad, AreaComun]}
    Rol: {type: string, enum: [Residente, Vigilancia, Mantenimiento, Administracion]}
    EstadoCuenta: {type: string, enum: [PendienteActivacion, Activa, Desactivada]}
    EstadoReporte: {type: string, enum: [Reportado, Asignado, EnProceso, Terminado, Cerrado, Cancelado, Unido]}
    Prioridad: {type: string, enum: [Urgente, Normal, Menor]}
    MedioOrigen: {type: string, enum: [Sistema, WhatsApp, Llamada, Caseta, Correo, Presencial]}
    Responsabilidad: {type: string, enum: [Comun, Privada, PorDeterminar]}
    Ocupacion: {type: string, enum: [Propietario, Inquilino]}
    Pagador: {type: string, enum: [Condominio, Condomino], description: 'Condominio (fondo de mantenimiento) o condómino (propietario de la unidad, RD-03 y RD-05).'}
    EstadoCorreo: {type: string, enum: [Pendiente, Enviado, Fallido]}
    MotivoDetencion: {type: string, enum: [AccesoAlDepartamento, EsperaDeProveedor, EsperaDePieza, EsperaDeAutorizacionDeGasto, Otro]}
    ParametroClave:
      type: string
      enum: [objetivoPrimeraAtencionUrgenteHoras, objetivoResolucionUrgenteHoras, objetivoResolucionNormalHoras, objetivoResolucionMenorHoras, umbralEstancamientoUrgenteHoras, umbralEstancamientoNormalHoras, umbralEstancamientoMenorHoras, plazoConfirmacionHoras, plazoReaperturaDias, ventanaRecurrenciaDias, minimoRecurrencia]

    # ---------- Autenticación ----------
    Credenciales:
      type: object
      required: [correo, password]
      properties:
        correo: {type: string, format: email}
        password: {type: string, format: password}
    Sesion:
      type: object
      required: [token, tipo, expiraEn, usuario]
      properties:
        token: {type: string, description: JWT.}
        tipo: {type: string, enum: [Bearer]}
        expiraEn: {type: integer, description: Segundos de inactividad tolerados., example: 1800}
        usuario: {$ref: '#/components/schemas/SesionUsuario'}
    SesionUsuario:
      type: object
      required: [id, nombre, rol]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        rol: {$ref: '#/components/schemas/Rol'}
        perfilAdministracion: {type: string, enum: [Administrador, Auxiliar], description: Solo para el rol Administracion.}
        delegacionVigente: {type: boolean, description: Solo para la Auxiliar.}
        unidad: {$ref: '#/components/schemas/Unit'}
    TokenPassword:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 8}

    # ---------- Padrón ----------
    Propietario:
      type: object
      required: [nombre, correo, viveEnCondominio]
      properties:
        nombre: {type: string}
        correo: {type: string, format: email}
        viveEnCondominio: {type: boolean, description: El propietario que no vive en el condominio no tiene cuenta.}
    Unit:
      type: object
      required: [id, torre, piso, numero, etiqueta, activa]
      properties:
        id: {type: string, format: uuid}
        torre: {type: string, example: B}
        piso: {type: integer, example: 5}
        numero: {type: string, example: '502'}
        etiqueta: {type: string, example: B-502}
        activa: {type: boolean}
        propietario: {$ref: '#/components/schemas/Propietario'}
    UnitCreate:
      type: object
      required: [torre, piso, numero, propietario]
      properties:
        torre: {type: string, minLength: 1}
        piso: {type: integer}
        numero: {type: string, minLength: 1}
        propietario: {$ref: '#/components/schemas/Propietario'}
    UnitUpdate:
      type: object
      properties:
        torre: {type: string}
        piso: {type: integer}
        numero: {type: string}
        propietario: {$ref: '#/components/schemas/Propietario'}
        activa: {type: boolean}
    UnitPage:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Unit'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    CommonArea:
      type: object
      required: [id, nombre, activa]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        activa: {type: boolean}
    CommonAreaCreate:
      type: object
      required: [nombre]
      properties:
        nombre: {type: string, minLength: 1}
    CommonAreaUpdate:
      type: object
      properties:
        nombre: {type: string}
        activa: {type: boolean}
    Vinculacion:
      type: object
      required: [id, unidad, ocupacion, fechaInicio]
      properties:
        id: {type: string, format: uuid}
        unidad: {$ref: '#/components/schemas/Unit'}
        ocupacion: {$ref: '#/components/schemas/Ocupacion'}
        fechaInicio: {type: string, format: date-time}
        fechaFin: {type: string, format: date-time, nullable: true}
    VinculacionCreate:
      type: object
      required: [unidadId, ocupacion, fechaInicio]
      properties:
        unidadId: {type: string, format: uuid}
        ocupacion: {$ref: '#/components/schemas/Ocupacion'}
        fechaInicio: {type: string, format: date-time}
    MantenimientoDatos:
      type: object
      required: [tipo]
      properties:
        tipo: {type: string, enum: [PersonalPropio, ProveedorExterno]}
        especialidad: {type: string}
        telefono: {type: string}
    User:
      type: object
      required: [id, nombre, correo, rol, estadoCuenta]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        correo: {type: string, format: email}
        rol: {$ref: '#/components/schemas/Rol'}
        estadoCuenta: {$ref: '#/components/schemas/EstadoCuenta'}
        vinculacion: {$ref: '#/components/schemas/Vinculacion'}
        mantenimiento: {$ref: '#/components/schemas/MantenimientoDatos'}
        perfilAdministracion: {type: string, enum: [Administrador, Auxiliar]}
    UserCreate:
      type: object
      required: [nombre, correo, rol]
      properties:
        nombre: {type: string, minLength: 1}
        correo: {type: string, format: email}
        rol: {$ref: '#/components/schemas/Rol'}
        vinculacion: {$ref: '#/components/schemas/VinculacionCreate'}
        mantenimiento: {$ref: '#/components/schemas/MantenimientoDatos'}
        perfilAdministracion: {type: string, enum: [Administrador, Auxiliar]}
    UserUpdate:
      type: object
      properties:
        nombre: {type: string}
        correo: {type: string, format: email}
        estadoCuenta: {type: string, enum: [Activa, Desactivada]}
        mantenimiento: {$ref: '#/components/schemas/MantenimientoDatos'}
    UserPage:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    ExternalProvider:
      type: object
      required: [id, nombre, especialidad, telefono, activo]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        especialidad: {type: string}
        telefono: {type: string}
        activo: {type: boolean}
    ExternalProviderCreate:
      type: object
      required: [nombre, especialidad, telefono]
      properties:
        nombre: {type: string, minLength: 1}
        especialidad: {type: string, minLength: 1}
        telefono: {type: string, minLength: 1}
    ExternalProviderUpdate:
      type: object
      properties:
        nombre: {type: string}
        especialidad: {type: string}
        telefono: {type: string}
        activo: {type: boolean}
    ExternalProviderPage:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ExternalProvider'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    ResponsableRef:
      type: object
      required: [id, tipo, nombre, sinAcceso]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [PersonalPropio, ProveedorExterno]}
        nombre: {type: string}
        especialidad: {type: string}
        sinAcceso: {type: boolean, description: 'true para proveedores sin cuenta («Sin acceso al sistema»).'}
    Category:
      type: object
      required: [id, nombre, subtipos]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string, example: Iluminación}
        subtipos:
          type: array
          description: Vacío si la categoría no tiene subtipo.
          items:
            type: object
            required: [nombre, prioridadSugerida]
            properties:
              nombre: {type: string, example: Jardín o exterior}
              prioridadSugerida: {$ref: '#/components/schemas/Prioridad'}
        prioridadSugerida: {$ref: '#/components/schemas/Prioridad'}

    # ---------- Reportes ----------
    Ubicacion:
      type: object
      required: [tipo]
      properties:
        tipo: {$ref: '#/components/schemas/TipoUbicacion'}
        unidadId: {type: string, format: uuid}
        areaComunId: {type: string, format: uuid}
        parteAfectada: {type: string, description: Parte afectada dentro de la unidad.}
        referencia: {type: string, description: Referencia en texto libre en áreas comunes.}
        etiqueta: {type: string, readOnly: true, example: B-502}
    ReportCreate:
      type: object
      required: [categoriaId, descripcion, ubicacion, esPeligroso]
      properties:
        categoriaId: {type: string, format: uuid}
        subtipo: {type: string}
        descripcion: {type: string, minLength: 10, maxLength: 1000}
        ubicacion: {$ref: '#/components/schemas/Ubicacion'}
        esPeligroso: {type: boolean}
        autorizaAcceso: {type: boolean, description: Obligatorio si la ubicación es el interior de una unidad.}
        horariosAcceso: {type: string}
        desdeCuando: {type: string, description: Opcional (RF-03-AC-9).}
        habiaPasadoAntes: {type: boolean, description: Opcional (RF-03-AC-9).}
        medioOrigen: {$ref: '#/components/schemas/MedioOrigen'}
        fechaAviso: {type: string, format: date-time}
        residenteReportanteId: {type: string, format: uuid}
        nombreReferencia: {type: string}
        contactoReferencia: {type: string}
    ReportCreateForm:
      type: object
      required: [datos]
      properties:
        datos: {$ref: '#/components/schemas/ReportCreate'}
        fotos: {type: array, maxItems: 5, items: {type: string, format: binary}}
        video: {type: string, format: binary}
    ArchivoRechazado:
      type: object
      required: [nombre, motivo]
      properties:
        nombre: {type: string}
        motivo: {type: string, example: Solo se aceptan fotos JPEG o PNG de hasta 10 MB}
    ReportCreated:
      allOf:
        - $ref: '#/components/schemas/ReportDetail'
        - type: object
          properties:
            archivosRechazados:
              type: array
              items: {$ref: '#/components/schemas/ArchivoRechazado'}
    ReportSummary:
      type: object
      required: [folio, estado, categoria, ubicacion, fechaAviso]
      properties:
        folio: {$ref: '#/components/schemas/Folio'}
        estado: {$ref: '#/components/schemas/EstadoReporte'}
        prioridad: {$ref: '#/components/schemas/Prioridad'}
        categoria: {type: string}
        subtipo: {type: string}
        descripcion: {type: string}
        ubicacion: {$ref: '#/components/schemas/Ubicacion'}
        fechaAviso: {type: string, format: date-time}
        detenido: {type: boolean}
        posibleDuplicado: {type: boolean}
        mensajeAcceso: {type: string, description: 'Solo Mantenimiento: «Sin autorización de acceso: coordinar con la Administración».'}
    ReportPage:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReportSummary'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    Ciclo:
      type: object
      required: [numero, inicio]
      properties:
        numero: {type: integer, minimum: 1}
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        fotosEvidencia: {type: array, items: {$ref: '#/components/schemas/FileRef'}}
        notaTrabajo: {type: string}
        pendientes: {type: string}
        sinEvidenciaFotografica: {type: boolean, description: 'Marca «Terminado sin evidencia fotográfica» (RD-09).'}
        justificacionSinEvidencia: {type: string}
        garantiaVencimiento: {type: string, format: date}
        confirmacion: {$ref: '#/components/schemas/Confirmacion'}
        plazoConfirmacionHasta: {type: string, format: date-time}
    ReportDetail:
      allOf:
        - $ref: '#/components/schemas/ReportSummary'
        - type: object
          description: Los campos que la matriz 2.3 niega al rol que consulta no se incluyen.
          properties:
            ubicacionOrigen: {$ref: '#/components/schemas/Ubicacion'}
            medioOrigen: {$ref: '#/components/schemas/MedioOrigen'}
            esPeligroso: {type: boolean}
            prioridadSugerida: {$ref: '#/components/schemas/Prioridad'}
            responsabilidad: {$ref: '#/components/schemas/Responsabilidad'}
            responsableCosto: {$ref: '#/components/schemas/Pagador'}
            responsable: {$ref: '#/components/schemas/ResponsableRef'}
            reportante: {type: object, description: Omitido en áreas comunes para el Residente., properties: {id: {type: string, format: uuid}, nombre: {type: string}, sinCuenta: {type: boolean}}}
            capturadoPor: {type: object, properties: {id: {type: string, format: uuid}, nombre: {type: string}}}
            fechaCaptura: {type: string, format: date-time}
            propietario: {$ref: '#/components/schemas/Propietario'}
            autorizaAcceso: {type: boolean}
            horariosAcceso: {type: string}
            desdeCuando: {type: string}
            habiaPasadoAntes: {type: boolean}
            fechaVisita: {type: string, format: date-time}
            detencionAbierta: {$ref: '#/components/schemas/Hold'}
            reportePrincipal: {$ref: '#/components/schemas/Folio'}
            montoCosto: {type: number, description: Solo Administración.}
            pagador: {$ref: '#/components/schemas/Pagador'}
            notas: {type: array, items: {$ref: '#/components/schemas/Note'}}
            fotosAlta: {type: array, items: {$ref: '#/components/schemas/FileRef'}}
            ciclos: {type: array, items: {$ref: '#/components/schemas/Ciclo'}}
            reaperturas: {type: integer}
    ReportCorrection:
      type: object
      properties:
        categoriaId: {type: string, format: uuid}
        subtipo: {type: string}
        descripcion: {type: string, minLength: 10, maxLength: 1000}
        ubicacion: {$ref: '#/components/schemas/Ubicacion'}
    HistoryEntry:
      type: object
      required: [id, tipo, fecha, autor]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [CambioEstado, Reclasificacion, Nota, Correccion, Detencion, Reanudacion, Costo, Confirmacion, PersistenciaIndicada, AvisoEnviado, Delegacion, UnionDuplicado, MarcaDuplicado]}
        fecha: {type: string, format: date-time}
        autor: {type: string, description: 'Nombre del usuario; si actuó en nombre de otro, ambos.'}
        actuaEnNombreDe: {type: string}
        campo: {type: string}
        valorAnterior: {type: string}
        valorNuevo: {type: string}
        comentario: {type: string}
        canal: {type: string, description: 'Canal del aviso, para constancia (RF-11).'}
    HistoryPage:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}
        pagination: {$ref: '#/components/schemas/Pagination'}

    # ---------- Flujo ----------
    AssignRequest:
      type: object
      required: [prioridad, responsableId]
      properties:
        prioridad: {$ref: '#/components/schemas/Prioridad'}
        responsableId: {type: string, format: uuid, description: Usuario de Mantenimiento o proveedor externo (con o sin acceso).}
        ubicacionOrigen: {$ref: '#/components/schemas/Ubicacion'}
        responsabilidad: {$ref: '#/components/schemas/Responsabilidad'}
        responsableCosto: {$ref: '#/components/schemas/Pagador'}
    ReclassifyRequest:
      type: object
      minProperties: 1
      properties:
        prioridad: {$ref: '#/components/schemas/Prioridad'}
        responsableId: {type: string, format: uuid}
        ubicacionOrigen: {$ref: '#/components/schemas/Ubicacion'}
        responsabilidad: {$ref: '#/components/schemas/Responsabilidad'}
        responsableCosto: {$ref: '#/components/schemas/Pagador'}
    StartRequest:
      type: object
      properties:
        actuaEnNombreDe: {type: string, description: Proveedor sin acceso en cuyo nombre registra la Administración.}
    CompletionData:
      type: object
      properties:
        notaTrabajo: {type: string, maxLength: 1000}
        justificacionSinEvidencia: {type: string, description: Solo Administración con proveedor sin acceso (RD-09).}
        garantiaVencimiento: {type: string, format: date}
        pendientes: {type: string, maxLength: 1000, description: Descripción de lo pendiente si solo se atendió lo urgente (RF-08-AC-7); queda en el historial.}
    CompletionForm:
      type: object
      properties:
        datos: {$ref: '#/components/schemas/CompletionData'}
        fotos: {type: array, minItems: 0, maxItems: 5, items: {type: string, format: binary}}
    CompletionResult:
      allOf:
        - $ref: '#/components/schemas/ReportDetail'
        - type: object
          properties:
            archivosRechazados:
              type: array
              items: {$ref: '#/components/schemas/ArchivoRechazado'}
    ResidentResponseCreate:
      type: object
      required: [respuesta]
      properties:
        respuesta: {type: string, enum: [YaQuedo, SigueFallando]}
        comentario: {type: string, maxLength: 1000, description: Obligatorio con `SigueFallando`.}
    Confirmacion:
      type: object
      required: [respuesta, fecha]
      properties:
        respuesta: {type: string, enum: [YaQuedo, SigueFallando]}
        comentario: {type: string}
        fecha: {type: string, format: date-time}
    CloseRequest:
      type: object
      properties:
        motivo: {type: string, description: Obligatorio si el residente respondió «Sigue fallando» o si se cierra sin confirmación.}
    CommentRequest:
      type: object
      required: [comentario]
      properties:
        comentario: {type: string, minLength: 1, maxLength: 1000}
    CancelRequest:
      type: object
      required: [motivo]
      properties:
        motivo: {type: string, minLength: 1, maxLength: 500}
    IndicacionPersistencia:
      type: object
      required: [id, fecha, residente]
      properties:
        id: {type: string, format: uuid}
        fecha: {type: string, format: date-time}
        residente: {type: string}
        comentario: {type: string}
    Note:
      type: object
      required: [id, texto, autor, fecha]
      properties:
        id: {type: string, format: uuid}
        texto: {type: string}
        autor: {type: string}
        fecha: {type: string, format: date-time}
    HoldCreate:
      type: object
      required: [motivo]
      properties:
        motivo: {$ref: '#/components/schemas/MotivoDetencion'}
        textoOtro: {type: string, description: Obligatorio con `Otro`.}
    Hold:
      type: object
      required: [id, motivo, fechaInicio, autor]
      properties:
        id: {type: string, format: uuid}
        motivo: {$ref: '#/components/schemas/MotivoDetencion'}
        textoOtro: {type: string}
        fechaInicio: {type: string, format: date-time}
        fechaFin: {type: string, format: date-time, nullable: true}
        autor: {type: string}
    FileRef:
      type: object
      required: [id, tipo, etapa, nombre, fecha]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [Foto, Video]}
        etapa: {type: string, enum: [Alta, Evidencia]}
        ciclo: {type: integer}
        nombre: {type: string}
        fecha: {type: string, format: date-time}
        url: {type: string}
    FileShare:
      type: object
      required: [id, archivoId, proveedorId, fecha]
      properties:
        id: {type: string, format: uuid}
        archivoId: {type: string, format: uuid}
        proveedorId: {type: string, format: uuid}
        consentimientoResidente: {type: boolean}
        fecha: {type: string, format: date-time}
    CostCreate:
      type: object
      required: [pagador]
      properties:
        monto: {type: number, minimum: 0, description: Opcional (RF-20); en pesos mexicanos.}
        pagador: {$ref: '#/components/schemas/Pagador'}
        comentario: {type: string}
        anulaCostoId: {type: string, format: uuid, description: Entrada de costo que esta corrige; la original se conserva.}
    Cost:
      allOf:
        - $ref: '#/components/schemas/CostCreate'
        - type: object
          required: [id, fecha, autor, anulada]
          properties:
            id: {type: string, format: uuid}
            fecha: {type: string, format: date-time}
            autor: {type: string}
            anulada: {type: boolean}

    # ---------- Avisos ----------
    Notification:
      type: object
      required: [id, evento, fecha, leido, mensaje]
      properties:
        id: {type: string, format: uuid}
        evento: {type: string}
        folio: {$ref: '#/components/schemas/Folio'}
        mensaje: {type: string}
        fecha: {type: string, format: date-time}
        leido: {type: boolean}
    NotificationPage:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    EmailDelivery:
      type: object
      required: [id, destinatario, estado, intentos, fecha]
      properties:
        id: {type: string, format: uuid}
        folio: {$ref: '#/components/schemas/Folio'}
        destinatario: {type: string, format: email}
        evento: {type: string}
        estado: {$ref: '#/components/schemas/EstadoCorreo'}
        intentos: {type: integer, maximum: 3}
        fecha: {type: string, format: date-time}
    EmailDeliveryPage:
      type: object
      required: [items, pagination]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EmailDelivery'}}
        pagination: {$ref: '#/components/schemas/Pagination'}

    # ---------- Delegaciones y parámetros ----------
    DelegationCreate:
      type: object
      required: [auxiliarId]
      properties:
        auxiliarId: {type: string, format: uuid}
        fechaFin: {type: string, format: date-time, description: Opcional; después de esta fecha la Auxiliar recibe 403.}
    DelegationUpdate:
      type: object
      properties:
        habilitada: {type: boolean}
        fechaFin: {type: string, format: date-time, nullable: true}
    Delegation:
      type: object
      required: [id, auxiliarId, habilitada, fechaInicio]
      properties:
        id: {type: string, format: uuid}
        auxiliarId: {type: string, format: uuid}
        habilitada: {type: boolean}
        fechaInicio: {type: string, format: date-time}
        fechaFin: {type: string, format: date-time, nullable: true}
    Parameter:
      type: object
      required: [clave, valor, unidad]
      properties:
        clave: {$ref: '#/components/schemas/ParametroClave'}
        descripcion: {type: string}
        valor: {type: number}
        unidad: {type: string, enum: [horas, dias, reportes]}
    ParameterChange:
      type: object
      required: [clave, valorAnterior, valorNuevo, usuario, fecha]
      properties:
        clave: {$ref: '#/components/schemas/ParametroClave'}
        valorAnterior: {type: number}
        valorNuevo: {type: number}
        usuario: {type: string}
        fecha: {type: string, format: date-time}

    # ---------- Tablero ----------
    CumplimientoBloque:
      type: object
      properties:
        reportes: {type: integer}
        cumplen: {type: integer}
        porcentaje: {type: integer, description: Entero redondeado.}
    MetricasPrioridad:
      type: object
      properties:
        prioridad: {$ref: '#/components/schemas/Prioridad'}
        primeraAtencionPromedioMin: {type: number, nullable: true}
        resolucionPromedioHoras: {type: number, nullable: true}
        cumplimientoPrimeraAtencion:
          type: object
          properties:
            personalPropio: {$ref: '#/components/schemas/CumplimientoBloque'}
            proveedoresExternos: {$ref: '#/components/schemas/CumplimientoBloque'}
        cumplimientoResolucion:
          type: object
          properties:
            personalPropio: {$ref: '#/components/schemas/CumplimientoBloque'}
            proveedoresExternos: {$ref: '#/components/schemas/CumplimientoBloque'}
    Metrics:
      type: object
      required: [desde, hasta]
      properties:
        desde: {type: string, format: date}
        hasta: {type: string, format: date}
        porEstado: {type: object, additionalProperties: {type: integer}}
        porCategoria: {type: object, additionalProperties: {type: integer}}
        porPrioridad: {type: array, items: {$ref: '#/components/schemas/MetricasPrioridad'}}
        recurrentes:
          type: array
          items:
            type: object
            properties:
              categoria: {type: string}
              ubicacionOrigen: {type: string}
              folios: {type: array, items: {$ref: '#/components/schemas/Folio'}}
        detenciones:
          type: array
          items:
            type: object
            properties:
              folio: {$ref: '#/components/schemas/Folio'}
              horasDetenido: {type: number}
              motivos: {type: array, items: {type: string}}
        adopcionPorcentaje: {type: integer}
        reaperturas: {type: integer}
