openapi: 3.0.3
info:
  title: ReportaYa API
  version: 1.0.0
  description: |-
    Contrato consolidado de la API REST de ReportaYa (FastAPI). Unifica las cuatro propuestas individuales
    (Medina, Castañeda "Lupus", Arreola y Guerrero) y se deriva de `SRS_equipo.md` v2.0. Cada decisión de
    diseño está justificada en `analisis_diferencias.md`.

    **Convenciones**
    - Rutas en inglés, sustantivos en plural, minúsculas y kebab-case. Los campos JSON conservan el vocabulario del dominio (español, camelCase).
    - Los reportes se identifican por **folio** (`RY-000124`); el resto de los recursos, por UUID.
    - Autenticación con JWT (`Authorization: Bearer <token>`). La sesión expira a los 30 min de inactividad y la cuenta se bloquea 15 min tras 5 intentos fallidos (RNF-06); durante el bloqueo se responde el mismo 401, para no revelar que la cuenta existe.
    - Fechas en ISO 8601 con la zona horaria del condominio (configurable; valor inicial `America/Mexico_City`). Los rangos `avisoDesde`/`avisoHasta` son inclusivos por días completos.
    - Nada se borra (RNF-07): se desactiva, se anula con una entrada nueva o se rechaza con 403 (`DELETE` de reportes y archivos).
    - Las transiciones de estado son **eventos modelados como subrecursos creados con POST** (`assignments`, `cycles`, `completions`, `closures`, `reopenings`, `cancellations`, `merges`); los 201 incluyen `Location`.
    - Colecciones paginadas con `page` y `pageSize`; respuesta `{items, pagination}`.
    - Los PATCH usan `application/merge-patch+json` (RFC 7396). `PUT`/`PATCH`/`DELETE` son idempotentes (`x-idempotent: true`); los POST que crean registros desde la PWA aceptan `Idempotency-Key` y entonces también lo son (RNF-11). Los PATCH/PUT aceptan `If-Match` con el `ETag` del GET (412 si hubo un cambio concurrente).

    **Contrato de errores (SRS 3.0).** Si aplica más de uno, gana el primero: 401 sin sesión, 404 recurso inexistente o no visible según la matriz 2.3, 403 rol sin permiso, 409 transición no permitida desde el estado actual, 422 validación de un dato. `400` se reserva para peticiones que no se pueden interpretar (JSON inválido, tipo de contenido o parámetro con tipo erróneo) y se evalúa después del 401. Un campo que el rol no puede enviar (por ejemplo un Residente que envía `fechaAviso`) responde 403 (RF-04-AC-8). Ninguna respuesta de error modifica datos. Todos los errores usan el esquema `Error`.

    **Extensiones**
    - `x-acceptance-criteria`: criterios Dado–Cuando–Entonces de `SRS_equipo.md` que el endpoint satisface (probables por API).
    - `x-ui-acceptance-criteria`: criterios marcados [UI]; el endpoint los soporta pero se prueban en la interfaz.
    - `x-requirements`: requerimientos RF/RNF cuando el SRS no define un criterio propio para la operación.
    - `x-roles`: roles autorizados; el backend aplica además la matriz de visibilidad (RNF-05).
    - `x-idempotent`: la operación es idempotente.
    - `x-coverage-gaps` (raíz): criterios sin endpoint HTTP propio y cómo se verifican.
  license:
    name: Uso académico (curso TC5062)
servers:
  - url: https://reportaya.example.com/api/v1
    description: Producción (único condominio, EX-07)
  - url: http://localhost:8000/api/v1
    description: Desarrollo local (Docker Compose)
security:
  - bearerAuth: []
x-coverage-gaps:
  - criteria: [RF-14-AC-4]
    gap: La cuenta inicial de Administración se crea con un comando de arranque del despliegue (CLI); exponerlo por HTTP sería una brecha de seguridad. Se prueba con una prueba de integración del comando.
  - criteria: [RF-22-AC-1, RF-22-AC-2, RF-22-AC-3]
    gap: La alerta de estancamiento la genera el worker, no una petición. Solo es observable en GET /notifications (Administración) y no existe endpoint que la dispare. Se prueba con el reloj fijado (RNF-10) y ejecutando el worker.
  - criteria: [RF-11-AC-4]
    gap: Los 3 reintentos de correo cada 10 minutos los ejecuta el worker; el resultado se observa en GET /email-deliveries.
  - criteria: [RF-03-AC-5]
    gap: 'Criterio [UI]: conservar los datos del formulario tras un error. La API solo garantiza el 422 con el nombre del campo.'
tags:
  - {name: Autenticación}
  - {name: Unidades}
  - {name: Áreas comunes}
  - {name: Usuarios}
  - {name: Responsables}
  - {name: Catálogo}
  - {name: Reportes}
  - {name: Flujo de estados}
  - {name: Seguimiento}
  - {name: Archivos}
  - {name: Costos y garantía}
  - {name: Avisos}
  - {name: Tablero}
  - {name: Delegaciones}
  - {name: Parámetros}
paths:
  # ================= Autenticación =================
  /sessions:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión (crea una sesión y devuelve el JWT)
      operationId: createSession
      security: []
      x-roles: [público]
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-02-AC-3]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credenciales'}
      responses:
        '201':
          description: Sesión creada, con JWT, rol y, para un Residente, su unidad.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sesion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: «Correo o contraseña incorrectos» (sin indicar cuál falló), cuenta desactivada, pendiente de activación o bloqueada temporalmente (RNF-06).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {codigo: CREDENCIALES_INVALIDAS, mensaje: Correo o contraseña incorrectos}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /sessions/current:
    get:
      tags: [Autenticación]
      summary: Datos de la sesión actual (rol y unidad)
      operationId: getCurrentSession
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: [RF-01-AC-1]
      x-idempotent: true
      responses:
        '200':
          description: Sesión vigente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SesionUsuario'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Autenticación]
      summary: Cerrar sesión (revoca la sesión del servidor)
      operationId: closeSession
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: [RF-01-AC-1]
      x-idempotent: true
      responses:
        '204': {description: Sesión cerrada; el JWT deja de ser aceptado.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
  /account-activations:
    post:
      tags: [Autenticación]
      summary: Activar la cuenta con el enlace de un solo uso (vence en 72 h)
      operationId: createAccountActivation
      security: []
      x-roles: [público]
      x-acceptance-criteria: [RF-14-AC-1, RF-14-AC-2]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenPassword'}
      responses:
        '204': {description: Cuenta «Activa»; el enlace deja de funcionar.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422':
          description: Enlace vencido («El enlace venció; pida uno nuevo a la Administración»), ya usado o contraseña inválida (mínimo 8 caracteres).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/ServerError'}
  /password-reset-requests:
    post:
      tags: [Autenticación]
      summary: Pedir un enlace de recuperación de contraseña (vence en 1 h)
      description: Responde igual exista o no el correo, para no revelar qué correos están registrados.
      operationId: createPasswordResetRequest
      security: []
      x-roles: [público]
      x-acceptance-criteria: [RF-14-AC-3]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo: {type: string, format: email}
      responses:
        '202':
          description: Solicitud aceptada; el correo se envía de forma asíncrona. Respuesta uniforme exista o no el correo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /password-resets:
    post:
      tags: [Autenticación]
      summary: Definir una contraseña nueva con el enlace de recuperación
      operationId: createPasswordReset
      security: []
      x-roles: [público]
      x-acceptance-criteria: [RF-14-AC-3]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenPassword'}
      responses:
        '204': {description: Contraseña actualizada; el enlace deja de funcionar.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Unidades =================
  /units:
    get:
      tags: [Unidades]
      summary: Listar unidades
      description: Administración recibe todos los datos, incluido el propietario. Vigilancia, que captura reportes de cualquier unidad (RF-04), recibe solo torre, piso, número y etiqueta (RD-07).
      operationId: listUnits
      x-roles: [Administración, Vigilancia]
      x-acceptance-criteria: []
      x-requirements: [RF-02, RF-04, RF-24]
      x-idempotent: true
      parameters:
        - {name: torre, in: query, schema: {type: string}}
        - {name: activa, in: query, description: Solo Administración puede pedir `false`., schema: {type: boolean, default: true}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de unidades.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnitPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Unidades]
      summary: Dar de alta una unidad con su propietario
      operationId: createUnit
      x-roles: [Administración]
      x-acceptance-criteria: [RF-02-AC-5, RF-02-AC-6]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UnitCreate'}
      responses:
        '201':
          description: Unidad creada.
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Unit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Dato faltante («El piso es obligatorio», «El correo del propietario es obligatorio») o unidad repetida.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {codigo: VALIDACION, mensaje: El correo del propietario es obligatorio, errores: [{campo: propietario.correo, mensaje: El correo del propietario es obligatorio}]}
        '500': {$ref: '#/components/responses/ServerError'}
  /units/{unitId}:
    parameters:
      - {$ref: '#/components/parameters/UnitId'}
    get:
      tags: [Unidades]
      summary: Consultar una unidad
      operationId: getUnit
      x-roles: [Administración, Vigilancia]
      x-acceptance-criteria: []
      x-requirements: [RF-02, RF-24]
      x-idempotent: true
      responses:
        '200':
          description: Unidad.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Unit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [Unidades]
      summary: Editar o desactivar una unidad (no se borra, RNF-07)
      description: 'Para desactivar se envía `{"activa": false}`.'
      operationId: updateUnit
      x-roles: [Administración]
      x-acceptance-criteria: [RF-02-AC-5, RF-02-AC-6]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/UnitUpdate'}
      responses:
        '200':
          description: Unidad actualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Unit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Áreas comunes =================
  /common-areas:
    get:
      tags: [Áreas comunes]
      summary: Listar áreas comunes
      description: Visible para todos los roles autenticados, porque el formulario de RF-03 y RF-04 las ofrece como ubicación.
      operationId: listCommonAreas
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-02, RF-03]
      x-idempotent: true
      parameters:
        - {name: activa, in: query, description: Solo Administración puede pedir `false`., schema: {type: boolean, default: true}}
      responses:
        '200':
          description: Áreas comunes.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CommonArea'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Áreas comunes]
      summary: Dar de alta un área común
      operationId: createCommonArea
      x-roles: [Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-02]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommonAreaCreate'}
      responses:
        '201':
          description: Área creada.
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonArea'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /common-areas/{areaId}:
    parameters:
      - {$ref: '#/components/parameters/AreaId'}
    get:
      tags: [Áreas comunes]
      summary: Consultar un área común
      operationId: getCommonArea
      x-roles: [Residente, Vigilancia, Mantenimiento, Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-02]
      x-idempotent: true
      responses:
        '200':
          description: Área común.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonArea'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [Áreas comunes]
      summary: Renombrar o desactivar un área común
      operationId: updateCommonArea
      x-roles: [Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-02]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/CommonAreaUpdate'}
      responses:
        '200':
          description: Área actualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonArea'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ================= Usuarios =================
  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      operationId: listUsers
      x-roles: [Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-02]
      x-idempotent: true
      parameters:
        - {name: rol, in: query, schema: {$ref: '#/components/schemas/Rol'}}
        - {name: estadoCuenta, in: query, schema: {$ref: '#/components/schemas/EstadoCuenta'}}
        - {name: unidadId, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Usuarios]
      summary: Dar de alta un usuario con cuenta (Residente, Vigilancia, Mantenimiento o Administración)
      description: |-
        El usuario queda «PendienteActivacion» y recibe el enlace de RF-14. Nadie se registra por su cuenta (EX-08).
        - Residente: requiere `vinculacion` (unidad, ocupación y fecha de inicio).
        - Mantenimiento: requiere `mantenimiento.tipo`; un `ProveedorExterno` con cuenta requiere además `especialidad` y `telefono`.
        - Administración: requiere `perfilAdministracion`.
        Los proveedores externos **sin acceso** se registran en `/external-providers`.
      operationId: createUser
      x-roles: [Administración]
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-4, RF-02-AC-8]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: Usuario creado en «PendienteActivacion».
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Validación («El correo ya está registrado», unidad inexistente, datos de rol faltantes).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {codigo: VALIDACION, mensaje: El correo ya está registrado, errores: [{campo: correo, mensaje: El correo ya está registrado}]}
        '500': {$ref: '#/components/responses/ServerError'}
  /users/{userId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [Usuarios]
      summary: Consultar un usuario
      operationId: getUser
      x-roles: [Administración]
      x-acceptance-criteria: [RF-02-AC-1]
      x-idempotent: true
      responses:
        '200':
          description: Usuario.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [Usuarios]
      summary: Editar, desactivar o reactivar un usuario
      description: |-
        `{"estadoCuenta": "Desactivada"}` desactiva al usuario y revoca sus sesiones: ya no inicia sesión (401), pero sus reportes siguen visibles para la Administración (RF-02-AC-3).
        `Activa` solo reactiva una cuenta `Desactivada` que ya había sido activada; una cuenta `PendienteActivacion` solo se activa con su enlace (RF-14) y ese cambio responde 409. No hay eliminación de usuarios.
      operationId: updateUser
      x-roles: [Administración]
      x-acceptance-criteria: [RF-02-AC-3]
      x-idempotent: true
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /users/{userId}/activation-links:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    post:
      tags: [Usuarios]
      summary: Emitir y enviar un enlace de activación nuevo (72 h)
      description: Atiende el mensaje de RF-14-AC-2 («pida uno nuevo a la Administración»). Invalida los enlaces anteriores. Solo para usuarios en `PendienteActivacion`.
      operationId: createActivationLink
      x-roles: [Administración]
      x-acceptance-criteria: [RF-14-AC-2]
      x-idempotent: false
      responses:
        '202':
          description: Enlace emitido; el correo se envía de forma asíncrona.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /users/{userId}/unit-links:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [Usuarios]
      summary: Historial de vinculaciones de un Residente a unidades
      operationId: listUnitLinks
      x-roles: [Administración]
      x-acceptance-criteria: []
      x-requirements: [RF-02, RF-10]
      x-idempotent: true
      responses:
        '200':
          description: Vinculaciones, de la más reciente a la más antigua.
          content:
