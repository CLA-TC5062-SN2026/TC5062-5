  # ================= Flujo de estados =================
  /reports/{folio}/assignments:
    post:
      tags: [Flujo de estados]
      summary: Crear la asignación del reporte (Reportado → Asignado)
      description: Exige prioridad y responsable (un usuario de Mantenimiento o un proveedor, con o sin acceso). Admite ubicación de origen, responsabilidad (por defecto `PorDeterminar`) y responsable del costo. Avisa al responsable si tiene cuenta y al reportante; si el reportante es «Sin cuenta», el aviso va a la Administración. La Auxiliar solo con delegación vigente.
      operationId: createAssignment
      x-roles: [Administración]
      x-acceptance-criteria: [RF-01-AC-3, RF-01-AC-4, RF-06-AC-1, RF-06-AC-2, RF-06-AC-3, RF-06-AC-10, RF-11-AC-2, RF-11-AC-5, RF-11-AC-8, RF-21-AC-1, RF-21-AC-2, RF-21-AC-4, RF-21-AC-5]
      x-idempotent: false
      parameters:
        - {$ref: '#/components/parameters/Folio'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignRequest'}
      responses:
        '201':
          description: Reporte en `Asignado`.
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Validación («La prioridad es obligatoria»; el responsable no es de Mantenimiento ni proveedor).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {codigo: VALIDACION, mensaje: La prioridad es obligatoria, errores: [{campo: prioridad, mensaje: La prioridad es obligatoria}]}
        '500': {$ref: '#/components/responses/ServerError'}
  /reports/{folio}/classification:
    patch:
      tags: [Flujo de estados]
      summary: Reclasificar sin cambiar el estado (prioridad, responsable, origen, responsabilidad, responsable del costo)
      description: Posible en `Asignado`, `EnProceso` o `Terminado`; el cambio de responsable solo en `Asignado` o `EnProceso`. Cada cambio registra valor anterior y nuevo. La prioridad final es de la Administración y nunca se revierte a la sugerida (RD-10). Reclasificar la responsabilidad avisa al reportante. La Auxiliar solo con delegación vigente.
